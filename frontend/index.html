<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>나만의 맛 스니펫 — 오늘의 미식 여행</title>
    <meta name="description" content="당신의 입맛 지도를 그려 가장 잘 맞는 식당을 추천해 드려요." />

    <!-- Open Graph (Facebook, KakaoTalk, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="맛 스니펫" />
    <meta property="og:title" content="나만의 맛 스니펫 — 오늘의 미식 여행" />
    <meta property="og:description" content="취향 벡터로 매칭한 오늘의 추천 식당 Top 5를 확인해 보세요." />
    <!-- 1200x630 권장. 정식 도메인 확정 후 절대 URL로 교체하세요. -->
    <meta property="og:image" content="/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="맛 스니펫 추천 카드" />
    <meta property="og:locale" content="ko_KR" />
    <!-- og:url은 정식 도메인 배포 후 절대 URL로 채워주세요. -->
    <!-- <meta property="og:url" content="https://example.com/" /> -->

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="나만의 맛 스니펫 — 오늘의 미식 여행" />
    <meta name="twitter:description" content="취향 벡터로 매칭한 오늘의 추천 식당 Top 5를 확인해 보세요." />
    <meta name="twitter:image" content="/og-cover.png" />
  </head>

  </body>
