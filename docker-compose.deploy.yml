# 데모 배포용 (EC2 단일 VM): app + postgres 한 번에 띄움
# 사용: docker compose -f docker-compose.deploy.yml up -d --build
services:
  db:
    image: postgres:15
    container_name: tastebridge_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tastebridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tastebridge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tastebridge}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: tastebridge_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tastebridge}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tastebridge}
      FLASK_DEBUG: "0"
      PORT: "5000"
      DEFAULT_KEYWORD: ${DEFAULT_KEYWORD:-삼겹살}
      UPLOAD_S3: ${UPLOAD_S3:-false}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-review_images}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
    ports:
      - "80:5000"

volumes:
  postgres_data: